name: jLauncher Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - 'NOTICE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - 'NOTICE'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (Lawn + Quickstep + GitHub flavor)
        run: ./gradlew assembleLawnWithQuickstepGithubDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jLauncher-debug-${{ github.sha }}
          path: build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
